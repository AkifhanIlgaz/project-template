root = "."
tmp_dir = "tmp"

[build]
  cmd = "templ generate && go build -o ./bin/server ./cmd/server"
  bin = "./bin/server"
  full_bin = "./bin/server"
  include_ext = ["go", "templ", "html", "yaml"]
  exclude_ext = ["_templ.go"]
  exclude_dir = ["tmp", "bin", "static", ".git", ".claude", ".agents"]
  exclude_regex = ["_test\\.go"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  time = false

[misc]
  clean_on_exit = true
