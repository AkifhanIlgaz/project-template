# Copy to config.yaml for local development: cp config.yaml.example config.yaml
# config.yaml is gitignored — never commit real secrets in it.
#
# In production there is no config.yaml at all: every field below is set via
# the matching environment variable instead (see internal/config/config.go).
#   env                  -> APP_ENV
#   server.port          -> PORT
#   server.base_url      -> BASE_URL
#   mongo.uri            -> MONGO_URI
#   mongo.db             -> MONGO_DB
#   session.secret       -> SESSION_SECRET
#   session.idle         -> SESSION_IDLE
#   google.client_id     -> GOOGLE_CLIENT_ID
#   google.client_secret -> GOOGLE_CLIENT_SECRET

env: development

server:
  port: "3000"
  base_url: http://localhost:3000

# Local dev: docker compose up -d starts a matching mongo instance.
mongo:
  uri: mongodb://localhost:27017
  db: project-template

session:
  # Generate with: openssl rand -base64 32
  secret: ""
  idle: 168h # 7 days

# Google Cloud Console → APIs & Services → Credentials → OAuth client ID
# Authorized redirect URI: ${server.base_url}/auth/google/callback
google:
  client_id: ""
  client_secret: ""
